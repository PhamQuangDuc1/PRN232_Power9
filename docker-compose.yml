version: '3.8'

services:
  # ==========================================
  # 1. DATABASE: Microsoft SQL Server 2022
  # ==========================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: power9-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - power9-network

  # ==========================================
  # 2. MESSAGE BROKER: Kafka & Zookeeper
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: power9-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - power9-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: power9-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - power9-network

  # ==========================================
  # 3. SERVICE 2: Recommendation gRPC Service
  # ==========================================
  recommendation-grpc:
    build:
      context: .
      dockerfile: src/Services/RecommendationService/Dockerfile
    container_name: power9-recommendation-grpc
    ports:
      - "50051:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - power9-network

  # ==========================================
  # 4. SERVICE 1: Routine REST API (Gateway)
  # ==========================================
  routine-api:
    build:
      context: .
      dockerfile: src/Services/RoutineService/Dockerfile
    container_name: power9-routine-api
    depends_on:
      - sqlserver
      - kafka
      - recommendation-grpc
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Power9Db;User Id=sa;Password=Password123!;TrustServerCertificate=True;
      - Kafka__BootstrapServers=kafka:29092
      - GrpcServices__RecommendationUrl=http://recommendation-grpc:8080
    networks:
      - power9-network

  # ==========================================
  # 5. SERVICE 3: Notification Background Worker
  # ==========================================
  notification-worker:
    build:
      context: .
      dockerfile: src/Services/NotificationWorkerService/Dockerfile
    container_name: power9-notification-worker
    depends_on:
      - sqlserver
      - kafka
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Power9Db;User Id=sa;Password=Password123!;TrustServerCertificate=True;
      - Kafka__BootstrapServers=kafka:29092
    networks:
      - power9-network

networks:
  power9-network:
    driver: bridge

volumes:
  sqlserver-data:
