// Hợp đồng Protobuf dùng chung để sinh gRPC client và kiểu dữ liệu phản hồi cho hai dịch vụ.
syntax = "proto3";

option csharp_namespace = "Power9.GrpcContracts";

package power9;

service RecommendationProtoService {
  rpc GetRoutineRecommendation (RecommendationRequest) returns (RecommendationReply);
}

// REST API gửi mã người dùng và trạng thái hiện tại để chọn thói quen.
message RecommendationRequest {
  int32 user_id = 1;
  int32 sitting_minutes = 2;
  string current_time_of_day = 3; // "Morning", "Afternoon", "Evening"
  string stress_level = 4;        // "Low", "Medium", "High"
}

// Dịch vụ gRPC trả thông tin thói quen đã chọn cho giao diện.
message RecommendationReply {
  int32 routine_id = 1;
  string title = 2;
  string category_name = 3;
  int32 duration_minutes = 4;
  string instruction = 5;
  int32 potential_points = 6;
}
