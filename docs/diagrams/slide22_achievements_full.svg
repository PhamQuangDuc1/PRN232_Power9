<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" style="background:#F8FAFC; font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif;">
  <!-- Top Pill -->
  <rect x="48" y="24" width="130" height="28" rx="14" fill="#E6F4EE"/>
  <text x="113" y="43" text-anchor="middle" fill="#0D7A5F" font-size="12" font-weight="700">P4 • PROOF</text>
  <text x="196" y="43" fill="#64748B" font-size="13" font-weight="700" letter-spacing="1.2">22 / ACHIEVEMENTS</text>

  <!-- Title & Subtitle -->
  <text x="48" y="92" fill="#0D7A5F" font-size="34" font-weight="800">Slide 22 <tspan fill="#1E293B">Achievements — đối chiếu mục tiêu với kết quả</tspan></text>
  <text x="48" y="124" fill="#64748B" font-size="17.5">Hoàn thành cả 3 mục tiêu cốt lõi đã cam kết ở Slide 04, vận hành thực tế trên cụm 7 Docker Containers với số đo kiểm chứng rõ ràng.</text>

  <!-- Top Info Pills -->
  <g transform="translate(48, 144)">
    <rect x="0" y="0" width="740" height="72" rx="10" fill="#E6F4EE"/>
    <text x="20" y="26" fill="#0D7A5F" font-size="12" font-weight="700">CÂU HỎI HỘI ĐỒNG</text>
    <text x="20" y="52" fill="#1E293B" font-size="17" font-style="italic" font-weight="600">Nhóm đã đạt được những gì đã cam kết ở phần đầu?</text>

    <rect x="760" y="0" width="180" height="72" rx="10" fill="#E6F4EE"/>
