    <!-- Point 1 -->
    <circle cx="18" cy="42" r="16" fill="#E6F4EE"/>
    <text x="18" y="47" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">1</text>
    <text x="48" y="36" fill="#0F172A" font-size="15.5" font-weight="700">Gắn từng mục tiêu (Slide 04) với Deliverable:</text>
    <text x="48" y="58" fill="#334155" font-size="13.5">• Mục tiêu 1 (Tập nhanh &lt; 3p) → gRPC Recommendation (:50051).</text>
    <text x="48" y="78" fill="#334155" font-size="13.5">• Mục tiêu 2 (Tribe City 2.5D) → 12 lô đất, nâng nhà, rêu 24h.</text>
    <text x="48" y="98" fill="#334155" font-size="13.5">• Mục tiêu 3 (Tự động hóa) → Kafka Worker + Gmail SMTP thật.</text>

    <!-- Point 2 -->
    <circle cx="18" cy="144" r="16" fill="#E6F4EE"/>
    <text x="18" y="149" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">2</text>
    <text x="48" y="138" fill="#0F172A" font-size="15.5" font-weight="700">Môi trường vận hành thực tế:</text>
    <text x="48" y="160" fill="#334155" font-size="13.5">Đóng gói đồng bộ 7 Docker Containers (SQL Server 2022, Kafka</text>
    <text x="48" y="180" fill="#334155" font-size="13.5">KRaft, Kafka UI, Mailpit, Routine API, gRPC, Notification Worker).</text>

    <!-- Point 3 -->
    <circle cx="18" cy="226" r="16" fill="#E6F4EE"/>
    <text x="18" y="231" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">3</text>
    <text x="48" y="220" fill="#0F172A" font-size="15.5" font-weight="700">Metric có cơ sở &amp; nguồn minh chứng:</text>
    <text x="48" y="242" fill="#334155" font-size="13.5">• 23 REST APIs, 7 bảng DB, 100+ bản ghi Seed, 31/31 xUnit Pass.</text>
    <text x="48" y="262" fill="#334155" font-size="13.5">• Độ trễ nội bộ gRPC &lt; 15ms; Kafka Consumer xử lý &lt; 1 giây.</text>

    <!-- Point 4 -->
    <circle cx="18" cy="308" r="16" fill="#E6F4EE"/>
    <text x="18" y="313" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">4</text>
    <text x="48" y="302" fill="#0F172A" font-size="15.5" font-weight="700">Cổng kiểm chứng Live Demo:</text>
    <text x="48" y="324" fill="#334155" font-size="13.5">• Web 2.5D &amp; Swagger: localhost:5000 | Kafka UI: localhost:8085</text>
    <text x="48" y="344" fill="#334155" font-size="13.5">• Mailpit: localhost:8025 &amp; Hộp thư Gmail thật (zrya1236987).</text>

    <!-- Bottom Left Box -->
    <rect x="0" y="385" width="490" height="190" rx="10" fill="#FDECE6" stroke="#FDBA74" stroke-width="1.2"/>
    <text x="20" y="415" fill="#C2410C" font-size="13.5" font-weight="700">NGUYÊN TẮC ĐÁNH GIÁ TRUNG THỰC (GUIDELINE V11)</text>
    <text x="20" y="443" fill="#431407" font-size="13">• Không dùng con số ước đoán chủ quan: Mọi con số trên slide</text>
    <text x="20" y="463" fill="#431407" font-size="13">  đều trích xuất từ lệnh dotnet test (31/31), docker ps (7/7) và</text>
    <text x="20" y="483" fill="#431407" font-size="13">  Power9DbSeeder.cs (13 Users, 4 Thành phố, 40 DailyLogs).</text>
    <text x="20" y="515" fill="#431407" font-size="13">• Chỉ rõ phần chưa đạt ở thanh dưới cùng (Polling 15s &amp; chưa</text>
    <text x="20" y="535" fill="#431407" font-size="13">  đưa lên Cloud) để dẫn dắt mạch lạc sang Slide 23 &amp; 24.</text>
  </g>

  <!-- Right Panel: Embed exact MẪU BỐ CỤC -->
  <g transform="translate(560, 226) scale(0.93)">
