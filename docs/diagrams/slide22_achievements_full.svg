    <text x="780" y="54" fill="#1E293B" font-size="24" font-weight="800">40 s</text>

    <rect x="960" y="0" width="592" height="72" rx="10" fill="#E6F4EE"/>
    <text x="980" y="26" fill="#0D7A5F" font-size="12" font-weight="700">MINH CHỨNG BẮT BUỘC</text>
    <text x="980" y="52" fill="#1E293B" font-size="15.5" font-weight="600">23 APIs (:5000), 31/31 Tests Pass, Kafka (:8085), Gmail thật</text>
  </g>

  <!-- Left Column: NỘI DUNG CẦN TRÌNH BÀY -->
  <g transform="translate(48, 248)">
