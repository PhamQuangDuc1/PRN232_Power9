<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" style="background:#F8FAFC; font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif;">
  <!-- Top Pill -->
  <rect x="48" y="24" width="130" height="28" rx="14" fill="#E6F4EE"/>
  <text x="113" y="43" text-anchor="middle" fill="#0D7A5F" font-size="12" font-weight="700">P4 • PROOF</text>
  <text x="196" y="43" fill="#64748B" font-size="13" font-weight="700" letter-spacing="1.2">23 / LIMITATIONS &amp; NEXT STEPS</text>

  <!-- Title & Subtitle -->
  <text x="48" y="92" fill="#0D7A5F" font-size="34" font-weight="800">Slide 23 <tspan fill="#1E293B">Limitations — trung thực và có hướng cải thiện</tspan></text>
  <text x="48" y="124" fill="#64748B" font-size="17.5">Nhận diện rõ 4 giới hạn kỹ thuật thực tế (HTTP Polling, Rule tĩnh, thiếu Outbox, chưa Load Test), đánh giá tác động và giải pháp cụ thể.</text>

  <!-- Top Info Pills -->
  <g transform="translate(48, 144)">
    <rect x="0" y="0" width="740" height="72" rx="10" fill="#E6F4EE"/>
    <text x="20" y="26" fill="#0D7A5F" font-size="12" font-weight="700">CÂU HỎI HỘI ĐỒNG</text>
    <text x="20" y="52" fill="#1E293B" font-size="17" font-style="italic" font-weight="600">Sản phẩm chưa làm được gì, và ảnh hưởng thế nào?</text>

    <rect x="760" y="0" width="180" height="72" rx="10" fill="#E6F4EE"/>
    <text x="780" y="26" fill="#0D7A5F" font-size="12" font-weight="700">THỜI LƯỢNG</text>
    <text x="780" y="54" fill="#1E293B" font-size="24" font-weight="800">25 s</text>

    <rect x="960" y="0" width="592" height="72" rx="10" fill="#E6F4EE"/>
    <text x="980" y="26" fill="#0D7A5F" font-size="12" font-weight="700">MINH CHỨNG BẮT BUỘC</text>
    <text x="980" y="52" fill="#1E293B" font-size="15.5" font-weight="600">Liên kết trực tiếp từ mục CHƯA ĐẠT (Slide 22) &amp; Test (Slide 21)</text>
  </g>

  <!-- Left Column: NỘI DUNG CẦN TRÌNH BÀY -->
  <g transform="translate(48, 248)">
    <text x="0" y="0" fill="#0D7A5F" font-size="14" font-weight="700" letter-spacing="1">NỘI DUNG CẦN TRÌNH BÀY</text>

    <!-- Point 1 -->
    <circle cx="18" cy="42" r="16" fill="#E6F4EE"/>
    <text x="18" y="47" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">1</text>
    <text x="48" y="36" fill="#0F172A" font-size="15.5" font-weight="700">4 Giới hạn thực tế có ảnh hưởng thật:</text>
    <text x="48" y="58" fill="#334155" font-size="13.5">• Bản đồ Tribe City 2.5D đồng bộ bằng HTTP Polling (15s).</text>
    <text x="48" y="78" fill="#334155" font-size="13.5">• Gợi ý gRPC dùng tập luật tĩnh (8 kịch bản cố định).</text>
    <text x="48" y="98" fill="#334155" font-size="13.5">• Chưa có Outbox Pattern cho Kafka &amp; chưa chạy Stress Test.</text>

    <!-- Point 2 -->
    <circle cx="18" cy="144" r="16" fill="#E6F4EE"/>
    <text x="18" y="149" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">2</text>
    <text x="48" y="138" fill="#0F172A" font-size="15.5" font-weight="700">Phân loại rõ ràng (Technology • Product • Testing):</text>
    <text x="48" y="160" fill="#334155" font-size="13.5">2 giới hạn về kiến trúc công nghệ (Polling, Kafka Outbox),</text>
    <text x="48" y="180" fill="#334155" font-size="13.5">1 giới hạn về dữ liệu/sản phẩm (Rule tĩnh) &amp; 1 về kiểm thử tải.</text>

    <!-- Point 3 -->
    <circle cx="18" cy="226" r="16" fill="#E6F4EE"/>
    <text x="18" y="231" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">3</text>
    <text x="48" y="220" fill="#0F172A" font-size="15.5" font-weight="700">Đánh giá tác động &amp; Mức độ ưu tiên:</text>
    <text x="48" y="242" fill="#334155" font-size="13.5">• Ưu tiên CAO: SignalR Real-time &amp; Đa dạng hóa bài tập gợi ý</text>
    <text x="48" y="262" fill="#334155" font-size="13.5">  (vì tác động trực tiếp đến trải nghiệm tương tác hàng ngày).</text>

    <!-- Point 4 -->
    <circle cx="18" cy="308" r="16" fill="#E6F4EE"/>
    <text x="18" y="313" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">4</text>
    <text x="48" y="302" fill="#0F172A" font-size="15.5" font-weight="700">Hướng xử lý kỹ thuật khả thi (Next Steps):</text>
    <text x="48" y="324" fill="#334155" font-size="13.5">Mỗi giới hạn đều gắn với 1 giải pháp kiến trúc chuẩn (.NET</text>
    <text x="48" y="344" fill="#334155" font-size="13.5">SignalR, Contextual Scoring, Outbox Table, k6 Benchmark).</text>

    <!-- Bottom Left Box -->
    <rect x="0" y="385" width="490" height="190" rx="10" fill="#FDECE6" stroke="#FDBA74" stroke-width="1.2"/>
    <text x="20" y="415" fill="#C2410C" font-size="13.5" font-weight="700">VÌ SAO CHỦ ĐỘNG ĐÁNH ĐỔI Ở GIAI ĐOẠN HIỆN TẠI?</text>
    <text x="20" y="443" fill="#431407" font-size="13">• Nhóm ưu tiên hoàn thiện trọn vẹn luồng Microservices đa giao</text>
    <text x="20" y="463" fill="#431407" font-size="13">  thức (REST + gRPC + Kafka + SMTP) và đảm bảo 100% quy tắc</text>
    <text x="20" y="483" fill="#431407" font-size="13">  nghiệp vụ cốt lõi (BR-01..BR-06) chạy đúng trước.</text>
    <text x="20" y="515" fill="#431407" font-size="13">• Việc dùng HTTP Polling và Rule Engine tất định giúp hệ thống</text>
    <text x="20" y="535" fill="#431407" font-size="13">  Stateless, dễ viết Unit Test (31/31 Pass) và không phát sinh lỗi</text>
    <text x="20" y="555" fill="#431407" font-size="13">  đồng bộ phức tạp trong phạm vi MVP.</text>
  </g>

  <!-- Right Panel: Embed exact MẪU BỐ CỤC -->
  <g transform="translate(560, 226) scale(0.93)">
    <rect x="8" y="8" width="1104" height="664" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="36" y="44" fill="#64748B" font-size="13.5" font-weight="700" letter-spacing="1.2">MẪU BỐ CỤC • BẢNG ĐÁNH GIÁ GIỚI HẠN KỸ THUẬT, TÁC ĐỘNG &amp; HƯỚNG CẢI THIỆN</text>

    <g transform="translate(36, 68)">
      <rect x="0" y="0" width="1048" height="46" fill="#0F172A"/>
      <text x="16" y="29" fill="#FFFFFF" font-size="13.5" font-weight="700">Giới hạn (Phân loại)</text>
      <text x="310" y="29" fill="#FFFFFF" font-size="13.5" font-weight="700">Tác động thực tế lên hệ thống / người dùng</text>
      <text x="655" y="29" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700">Ưu tiên</text>
      <text x="725" y="29" fill="#FFFFFF" font-size="13.5" font-weight="700">Next step (Hướng xử lý cụ thể)</text>

      <!-- Row 1 -->
      <rect x="0" y="46" width="1048" height="105" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.9"/>
      <rect x="16" y="60" width="96" height="22" rx="4" fill="#EFF6FF"/>
      <text x="64" y="75" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="700">TECHNOLOGY</text>
      <text x="16" y="102" fill="#0F172A" font-size="13.5" font-weight="700">Đồng bộ Tribe City bằng</text>
      <text x="16" y="122" fill="#0F172A" font-size="13.5" font-weight="700">HTTP Polling (chu kỳ 15s)</text>
      <text x="16" y="140" fill="#64748B" font-size="11.5">(Chưa có WebSocket / SignalR)</text>

      <text x="310" y="78" fill="#334155" font-size="13">• Độ trễ hiển thị tối đa 15 giây khi đồng nghiệp cùng</text>
      <text x="310" y="98" fill="#334155" font-size="13">  phòng vừa nâng cấp tầng nhà hoặc quét sạch rêu.</text>
      <text x="310" y="120" fill="#334155" font-size="13">• Tạo truy vấn GET định kỳ lên SQL Server khi mở</text>
      <text x="310" y="140" fill="#334155" font-size="13">  nhiều tab bản đồ 2.5D cùng lúc.</text>

      <rect x="623" y="84" width="64" height="30" rx="6" fill="#FEE2E2"/>
      <text x="655" y="104" text-anchor="middle" fill="#DC2626" font-size="13.5" font-weight="800">Cao</text>

      <text x="725" y="78" fill="#0F172A" font-size="13" font-weight="600">Tích hợp ASP.NET Core SignalR Hub:</text>
      <text x="725" y="100" fill="#334155" font-size="12.5">Đẩy sự kiện cập nhật ô đất (SlotIndex, Floor,</text>
      <text x="725" y="120" fill="#334155" font-size="12.5">IsMossy) theo RoomCode ngay khi Check-in</text>
      <text x="725" y="140" fill="#0D7A5F" font-size="12" font-weight="600">→ Giảm độ trễ từ 15s xuống &lt; 100ms.</text>

      <!-- Row 2 -->
      <rect x="0" y="151" width="1048" height="105" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.9"/>
      <rect x="16" y="165" width="118" height="22" rx="4" fill="#F5F3FF"/>
      <text x="75" y="180" text-anchor="middle" fill="#6D28D9" font-size="11" font-weight="700">PRODUCT &amp; DATA</text>
      <text x="16" y="207" fill="#0F172A" font-size="13.5" font-weight="700">Gợi ý bài tập bằng tập</text>
      <text x="16" y="227" fill="#0F172A" font-size="13.5" font-weight="700">luật tĩnh (8 kịch bản gRPC)</text>
      <text x="16" y="245" fill="#64748B" font-size="11.5">(RecommendationEngine.cs)</text>

      <text x="310" y="183" fill="#334155" font-size="13">• Thuật toán tất định (Deterministic): Cùng số phút</text>
      <text x="310" y="203" fill="#334155" font-size="13">  ngồi + buổi + mức Stress luôn trả về đúng 1 bài tập.</text>
      <text x="310" y="225" fill="#334155" font-size="13">• Chưa tận dụng lịch sử 40+ bản ghi DailyLogs để</text>
      <text x="310" y="245" fill="#334155" font-size="13">  tránh lặp lại bài tập người dùng vừa làm xong.</text>

      <rect x="623" y="189" width="64" height="30" rx="6" fill="#FEE2E2"/>
      <text x="655" y="209" text-anchor="middle" fill="#DC2626" font-size="13.5" font-weight="800">Cao</text>

      <text x="725" y="183" fill="#0F172A" font-size="13" font-weight="600">Nâng cấp Hybrid Scoring / ML.NET:</text>
      <text x="725" y="205" fill="#334155" font-size="12.5">Kết hợp luật ưu tiên sức khỏe với trọng số</text>
      <text x="725" y="225" fill="#334155" font-size="12.5">lịch sử tập (trừ điểm bài vừa tập trong 24h</text>
      <text x="725" y="245" fill="#0D7A5F" font-size="12" font-weight="600">qua để tăng độ đa dạng gợi ý).</text>

      <!-- Row 3 -->
      <rect x="0" y="256" width="1048" height="105" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.9"/>
      <rect x="16" y="270" width="96" height="22" rx="4" fill="#EFF6FF"/>
      <text x="64" y="285" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="700">TECHNOLOGY</text>
      <text x="16" y="312" fill="#0F172A" font-size="13.5" font-weight="700">Chưa có bảng Outbox khi</text>
      <text x="16" y="332" fill="#0F172A" font-size="13.5" font-weight="700">bắn sự kiện lên Kafka</text>
      <text x="16" y="350" fill="#64748B" font-size="11.5">(CheckInsController.cs)</text>

      <text x="310" y="288" fill="#334155" font-size="13">• Hiện tại lưu SQL Server xong mới gọi Kafka Producer</text>
      <text x="310" y="308" fill="#334155" font-size="13">  trong khối try/catch (ưu tiên không chặn người dùng).</text>
      <text x="310" y="330" fill="#334155" font-size="13">• Nếu Kafka Broker mất kết nối đúng lúc check-in, sự</text>
      <text x="310" y="350" fill="#334155" font-size="13">  kiện tính lại Streak và gửi mail chúc mừng bị bỏ lỡ.</text>

      <rect x="623" y="294" width="64" height="30" rx="6" fill="#FFEDD5"/>
      <text x="655" y="314" text-anchor="middle" fill="#EA580C" font-size="13.5" font-weight="800">TB</text>

      <text x="725" y="288" fill="#0F172A" font-size="13" font-weight="600">Triển khai Transactional Outbox:</text>
      <text x="725" y="310" fill="#334155" font-size="12.5">Ghi bản ghi OutboxMessages chung 1 DB</text>
      <text x="725" y="330" fill="#334155" font-size="12.5">Transaction với DailyLogs; dùng Background</text>
      <text x="725" y="350" fill="#0D7A5F" font-size="12" font-weight="600">Relay retry đẩy lên Kafka đảm bảo At-least-once.</text>

      <!-- Row 4 -->
      <rect x="0" y="361" width="1048" height="105" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.9"/>
      <rect x="16" y="375" width="76" height="22" rx="4" fill="#FEF3C7"/>
      <text x="54" y="390" text-anchor="middle" fill="#B45309" font-size="11" font-weight="700">TESTING</text>
      <text x="16" y="417" fill="#0F172A" font-size="13.5" font-weight="700">Chưa chạy Stress Test &amp;</text>
      <text x="16" y="437" fill="#0F172A" font-size="13.5" font-weight="700">tranh chấp đồng thời cao</text>
      <text x="16" y="455" fill="#64748B" font-size="11.5">(Load / Concurrency Test)</text>

      <text x="310" y="393" fill="#334155" font-size="13">• Đã có 31 Unit Tests &amp; E2E functional, nhưng chưa</text>
      <text x="310" y="413" fill="#334155" font-size="13">  đo p95/p99 latency dưới tải hàng trăm request/giây.</text>
      <text x="310" y="435" fill="#334155" font-size="13">• Khi 2 người bấm Quick-Match cùng mili-giây vào ô</text>
      <text x="310" y="455" fill="#334155" font-size="13">  đất cuối, 1 người sẽ bị lỗi DB Unique Index (HTTP 500).</text>

      <rect x="623" y="399" width="64" height="30" rx="6" fill="#FFEDD5"/>
      <text x="655" y="419" text-anchor="middle" fill="#EA580C" font-size="13.5" font-weight="800">TB</text>

      <text x="725" y="393" fill="#0F172A" font-size="13" font-weight="600">Benchmark bằng k6 &amp; Optimistic Retry:</text>
      <text x="725" y="415" fill="#334155" font-size="12.5">Viết script k6 (500 VU giờ nghỉ giải lao) và</text>
      <text x="725" y="435" fill="#334155" font-size="12.5">bắt DbUpdateException ở Quick-Match để</text>
      <text x="725" y="455" fill="#0D7A5F" font-size="12" font-weight="600">tự động chuyển sang phòng kế tiếp mượt mà.</text>

      <line x1="295" y1="0" x2="295" y2="466" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="605" y1="0" x2="605" y2="466" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="705" y1="0" x2="705" y2="466" stroke="#CBD5E1" stroke-width="1"/>
    </g>

    <g transform="translate(36, 554)">
      <rect x="0" y="0" width="1048" height="58" rx="8" fill="#E6F4EE"/>
      <text x="20" y="25" fill="#0D7A5F" font-size="13" font-weight="700">ĐÁNH GIÁ TỔNG THỂ:</text>
      <text x="165" y="25" fill="#1E293B" font-size="13">Cả 4 giới hạn trên đều thuộc tầng tối ưu hóa mở rộng (Scale &amp; Real-time), không làm sai lệch</text>
      <text x="20" y="45" fill="#1E293B" font-size="13">dữ liệu nghiệp vụ cốt lõi (BR-01..BR-06 đã pass 31/31 tests) và được chuyển hóa thành lộ trình nâng cấp tại <tspan fill="#0D7A5F" font-weight="700">Slide 24</tspan>.</text>
    </g>

    <text x="36" y="644" fill="#64748B" font-size="12.5" font-style="italic">Ưu tiên giới hạn liên quan tính năng chính (Tribe City sync, gRPC Recommendation, Kafka Reliability) thay vì chi tiết trang trí.</text>
  </g>
</svg>
