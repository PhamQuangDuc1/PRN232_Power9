      <text x="48" y="72" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">1</text>
      <text x="98" y="38" fill="#0F172A" font-size="17" font-weight="800">PROBLEM SOLVED — Giải quyết trọn vẹn bài toán bỏ cuộc của dân văn phòng</text>
      <text x="98" y="66" fill="#334155" font-size="14">• Chuyển đổi việc tập luyện đơn độc, tốn thời gian thành các bài vận động ngắn <tspan fill="#1D4ED8" font-weight="700">&lt; 3 phút ngay tại bàn làm việc</tspan></text>
      <text x="98" y="90" fill="#334155" font-size="14">  (ngừa đau mỏi cổ vai gáy &amp; mỏi mắt) kết hợp <tspan fill="#1D4ED8" font-weight="700">trách nhiệm đồng đội (Social Accountability)</tspan> giữa 12 đồng nghiệp</text>
