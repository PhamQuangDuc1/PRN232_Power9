    <text x="48" y="262" fill="#334155" font-size="13.5">độ trễ gRPC &lt; 15ms, Kafka &lt; 1s, 100% có Fallback an toàn.</text>

    <!-- Point 4 -->
    <circle cx="18" cy="318" r="16" fill="#E6F4EE"/>
    <text x="18" y="323" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">4</text>
    <text x="48" y="312" fill="#0F172A" font-size="15.5" font-weight="700">Định hướng cải tiến &amp; Lời cảm ơn:</text>
