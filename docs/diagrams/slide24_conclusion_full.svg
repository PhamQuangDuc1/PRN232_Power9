  <!-- Title & Subtitle -->
  <text x="48" y="92" fill="#0D7A5F" font-size="34" font-weight="800">Slide 24 <tspan fill="#1E293B">Conclusion — kết lại bằng ba thông điệp</tspan></text>
  <text x="48" y="124" fill="#64748B" font-size="17.5">Chốt lại giá trị thực tế đã chứng minh của Power9 Office Routine &amp; Tribe City: Giải quyết đúng bài toán, Kiến trúc chạy thật, Kiểm thử 100%.</text>

