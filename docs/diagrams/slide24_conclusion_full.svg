      <text x="98" y="90" fill="#334155" font-size="14">• Độ trễ gRPC <tspan fill="#0D7A5F" font-weight="700">&lt; 15ms</tspan> (có Fallback chịu lỗi 100%); Kafka Consumer xử lý <tspan fill="#0D7A5F" font-weight="700">&lt; 1s</tspan> (chống cộng trùng bằng EventId UNIQUE).</text>
      <text x="98" y="112" fill="#64748B" font-size="13">• Bước tiếp theo: Nâng cấp SignalR Real-time (&lt; 100ms), Hybrid ML Scoring &amp; Transactional Outbox.</text>
    </g>

