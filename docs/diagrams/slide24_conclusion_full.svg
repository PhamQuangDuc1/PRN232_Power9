    <!-- Point 1 -->
    <circle cx="18" cy="42" r="16" fill="#E6F4EE"/>
    <text x="18" y="47" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">1</text>
    <text x="48" y="36" fill="#0F172A" font-size="15.5" font-weight="700">Problem &amp; Người hưởng lợi:</text>
    <text x="48" y="58" fill="#334155" font-size="13.5">Giúp nhân viên văn phòng &amp; lập trình viên xóa bỏ thói quen</text>
    <text x="48" y="78" fill="#334155" font-size="13.5">ngồi lì bằng bài tập &lt; 3 phút gắn kết 12 đồng nghiệp.</text>

    <!-- Point 2 -->
    <circle cx="18" cy="134" r="16" fill="#E6F4EE"/>
    <text x="18" y="139" text-anchor="middle" fill="#0D7A5F" font-size="14" font-weight="700">2</text>
